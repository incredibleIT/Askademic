# 本地开发依赖：PostgreSQL(ParadeDB/pg17) + Redis
# 只暴露到 127.0.0.1，避免落到局域网。
services:
  postgres:
    image: paradedb/paradedb:v0.25.11-pg17
    container_name: weknora-pg
    environment:
      POSTGRES_USER: weknora
      POSTGRES_PASSWORD: weknora123
      POSTGRES_DB: weknora
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weknora -d weknora"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.0-alpine
    container_name: weknora-redis
    command: redis-server --appendonly yes --requirepass weknora123
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped

volumes:
  pgdata:
